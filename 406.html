<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>406 - Not Acceptable</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f4f6f8;
      color: #202124;
    }

    main {
      max-width: 36rem;
      margin: 1rem;
      padding: 2rem;
      text-align: center;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px #0002;
    }

    .code {
      margin: 0;
      color: #b42318;
      font-size: 4rem;
      line-height: 1;
    }

    a {
      color: #0645ad;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #171717;
        color: #f1f1f1;
      }

      main {
        background: #242424;
      }

      a {
        color: #8ab4f8;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="code">406</p>
    <h1>Not Acceptable</h1>
    <p>The request could not be completed. Check the address or try again later.</p>
    <p><a href="../">Return to the site</a></p>
  </main>
</body>
</html>
